<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Notes Tayar Ho Rahe Hain</title>
  <style>
    /* Reset & Base Styles (Mobile-First) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Background Shapes (Animated) */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
      animation: floatBg 8s ease-in-out infinite alternate;
    }

    .shape-1 {
      width: 200px;
      height: 200px;
      background: #6366f1;
      top: 10%;
      left: -10%;
    }

    .shape-2 {
      width: 250px;
      height: 250px;
      background: #a855f7;
      bottom: 10%;
      right: -10%;
      animation-delay: -4s;
    }

    /* Main Container Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Animated Illustration Area */
    .illustration {
      position: relative;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.25;
      position: absolute;
      user-select: none;
    }

    .floating-note {
      font-size: 3.5rem;
      z-index: 2;
      animation: floatNote 3s ease-in-out infinite;
    }

    .pencil {
      position: absolute;
      font-size: 2rem;
      right: 25%;
      bottom: 20%;
      z-index: 3;
      animation: writing 1.5s ease-in-out infinite alternate;
    }

    /* Text & Typography */
    .title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.825rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #818cf8;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.7);
      animation: pulse 1.6s infinite;
    }

    /* Action Button */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.3s ease;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 5px 10px -3px rgba(99, 102, 241, 0.4);
    }

    /* Desktop Adjustments */
    @media (min-width: 640px) {
      .card {
        padding: 2.5rem 2rem;
      }
      .title {
        font-size: 1.5rem;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
      }
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatNote {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes writing {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-8px, -8px) rotate(-15deg); }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(129, 140, 248, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(129, 140, 248, 0);
      }
    }

    @keyframes floatBg {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Background Glowing Effects -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Main Content Card -->
  <main class="card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      Work in Progress
    </div>

    <div class="illustration">
      <div class="error-code">404</div>
      <div class="floating-note">📝</div>
      <div class="pencil">✏️</div>
    </div>

    <h1 class="title">Notes ka kaam abhi jaari hai!</h1>
    
    <p class="subtitle">
      Yeh page abhi tayar ho raha hai. Kripya thoda wait karein, aur tab tak jo notes pehle se available hain unse padhai karein.
    </p>

    <!-- Apne Homepage ya Available Notes page ka link yahan daalein -->
    <a href="https://studyspace011.github.io/5-sem-eng-notes/" class="btn">Available Notes Padhiye</a>
  </main>

</body>
</html>
